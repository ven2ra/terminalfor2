<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;background:var(--bg-app);color:var(--text-primary);font:var(--type-body);padding:16px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:12px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--ls-label);color:var(--text-faint)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {SearchInput,SelectMenu,SegmentedControl,FilterTabs,AmountField,RangeSlider,CoinMark}=window.TerminalforDesignSystem_c51d59;
function Demo(){const[q,setQ]=React.useState('');const[cur,setCur]=React.useState('USDT');const[mode,setMode]=React.useState('Buy');const[tab,setTab]=React.useState('All');const[pct,setPct]=React.useState(62);
return <div className="col" style={{gap:18,maxWidth:640}}>

<FilterTabs options={['All','Trends','Favorites','Top Gainers','Top Losers']} value={tab} onChange={setTab}/>
<div className="row" style={{alignItems:'flex-start',gap:16}}>
<SegmentedControl options={['Buy','Sell','Swap']} value={mode} onChange={setMode} style={{width:280}}/>
<div style={{flex:1,minWidth:280}}><RangeSlider value={pct} onChange={setPct}/></div></div>
<AmountField label="Spend" value="90,020.9" currency={<SelectMenu options={['USDT','USDC']} value="USDT" leading={<CoinMark symbol="usdt" size={16}/>}/>} style={{maxWidth:420}}/>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
