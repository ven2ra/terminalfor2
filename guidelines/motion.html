<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}@keyframes pulse{0%,100%{background:var(--surface-inset)}50%{background:var(--accent-soft)}}</style></head><body><div style="display:flex;gap:10px;align-items:stretch">
<div class="sw" style="background:var(--surface-inset);animation:pulse 1.6s var(--ease-standard) infinite"><b>tick pulse</b><i>600ms value flash</i></div>
<div class="sw" style="background:var(--surface-inset)"><b>hover 120ms</b><i>--dur-fast</i></div>
<div class="sw" style="background:var(--surface-inset)"><b>enter 180ms</b><i>--dur-base</i></div>
<div class="sw" style="background:var(--surface-inset)"><b>panel 260ms</b><i>--dur-slow</i></div>
<div class="sw" style="background:var(--surface-inset);transform:scale(.985)"><b>press .985</b><i>--press-scale</i></div></div></body></html>
