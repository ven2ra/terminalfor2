<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}</style></head><body><div class="g"><div class="sw" style="background:var(--surface-inset);border-radius:4px"><b>r-xs</b><i>4px · kbd, badge</i></div><div class="sw" style="background:var(--surface-inset);border-radius:6px"><b>r-sm</b><i>6px · menu row</i></div><div class="sw" style="background:var(--surface-inset);border-radius:10px"><b>r-md</b><i>10px · button, field</i></div><div class="sw" style="background:var(--surface-inset);border-radius:12px"><b>r-lg</b><i>12px · inset group</i></div><div class="sw" style="background:var(--surface-inset);border-radius:16px"><b>r-xl</b><i>16px · card</i></div><div class="sw" style="background:var(--surface-inset);border-radius:20px"><b>r-2xl</b><i>20px · panel</i></div><div class="sw" style="background:var(--surface-inset);border-radius:999px"><b>r-pill</b><i>999 · chip</i></div></div></body></html>
