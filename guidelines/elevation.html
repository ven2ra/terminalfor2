<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Matte surfaces: hairline + surface value, shadow only for popovers" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}</style></head><body><div class="g" style="height:110px;padding:6px">
<div class="sw" style="height:98px;background:var(--surface-card);box-shadow:none"><b>flat card</b><i>hairline only</i></div>
<div class="sw" style="height:98px;background:var(--surface-card);box-shadow:var(--shadow-card)"><b>shadow-card</b><i>0 8px 24px /.45</i></div>
<div class="sw" style="height:98px;background:var(--surface-raised);box-shadow:var(--shadow-popover)"><b>shadow-popover</b><i>dropdowns</i></div>
<div class="sw" style="height:98px;background:var(--gradient-cta);box-shadow:var(--shadow-cta-glow)"><b>cta-glow</b><i>hover only</i></div>
<div class="sw" style="height:98px;background:var(--surface-inset);box-shadow:var(--shadow-focus)"><b>focus ring</b><i>3px violet 35%</i></div></div></body></html>
