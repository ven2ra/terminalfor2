<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}</style></head><body><div class="g"><div class="sw" style="background:var(--surface-inset);color:var(--text-primary)"><b>text-primary #f4f5f7</b><i>Titles, prices</i></div><div class="sw" style="background:var(--surface-inset);color:var(--text-body)"><b>text-body #b7bcc7</b><i>Body copy</i></div><div class="sw" style="background:var(--surface-inset);color:var(--text-muted)"><b>text-muted #8b90a0</b><i>Nav, secondary</i></div><div class="sw" style="background:var(--surface-inset);color:var(--text-faint)"><b>text-faint #5b6070</b><i>Eyebrows, units</i></div></div></body></html>
