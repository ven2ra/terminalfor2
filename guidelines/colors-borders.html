<!-- @dsCard group="Colors" viewport="700x130" name="Hairlines & tints" subtitle="Structure is drawn with translucent white, never grey fills" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}.sw:nth-child(1){border-color:var(--border-hairline)}.sw:nth-child(2){border-color:var(--border-subtle)}.sw:nth-child(3){border-color:var(--border-strong)}.sw:nth-child(4){border-color:var(--border-accent)}</style></head><body><div class="g"><div class="sw" style="background:var(--surface-card);color:var(--text-primary)"><b>border-hairline 6%</b><i>1px default</i></div><div class="sw" style="background:var(--surface-card);color:var(--text-primary)"><b>border-subtle 9%</b><i>hover / popover</i></div><div class="sw" style="background:var(--surface-card);color:var(--text-primary)"><b>border-strong 14%</b><i>emphasis</i></div><div class="sw" style="background:var(--accent-soft);color:var(--text-primary)"><b>accent-soft</b><i>selected filter</i></div><div class="sw" style="background:var(--surface-hover);color:var(--text-primary)"><b>surface-hover 4.5%</b><i>row hover</i></div></div></body></html>
