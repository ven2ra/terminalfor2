<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}</style></head><body><div class="g"><div class="sw" style="background:var(--bg-app);color:var(--text-primary)"><b>bg-app</b><i>#050608</i></div><div class="sw" style="background:var(--bg-rail);color:var(--text-primary)"><b>bg-rail</b><i>#07080b</i></div><div class="sw" style="background:var(--surface-panel);color:var(--text-primary)"><b>surface-panel</b><i>#0b0d10</i></div><div class="sw" style="background:var(--surface-card);color:var(--text-primary)"><b>surface-card</b><i>#0e1013</i></div><div class="sw" style="background:var(--surface-inset);color:var(--text-primary)"><b>surface-inset</b><i>#12151a</i></div><div class="sw" style="background:var(--surface-raised);color:var(--text-primary)"><b>surface-raised</b><i>#171a20</i></div></div></body></html>
