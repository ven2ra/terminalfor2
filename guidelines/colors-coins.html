<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg-app);color:var(--text-primary);font:var(--type-body)}.g{display:flex;gap:8px}.sw{flex:1;height:74px;border-radius:var(--r-md);border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-label);font-weight:var(--fw-semibold);display:block}.sw i{font:var(--type-numeric);color:var(--text-faint);font-style:normal;letter-spacing:.02em}</style></head><body><div class="g"><div class="sw" style="background:var(--coin-btc);color:#0b0d10"><b>BTC</b><i>--coin-btc</i></div><div class="sw" style="background:var(--coin-eth);color:#0b0d10"><b>ETH</b><i>--coin-eth</i></div><div class="sw" style="background:var(--coin-usdt);color:#0b0d10"><b>USDT</b><i>--coin-usdt</i></div><div class="sw" style="background:var(--coin-sol);color:#0b0d10"><b>SOL</b><i>--coin-sol</i></div><div class="sw" style="background:var(--coin-doge);color:#0b0d10"><b>DOGE</b><i>--coin-doge</i></div><div class="sw" style="background:var(--coin-ltc);color:#0b0d10"><b>LTC</b><i>--coin-ltc</i></div><div class="sw" style="background:var(--coin-matic);color:#0b0d10"><b>MATIC</b><i>--coin-matic</i></div><div class="sw" style="background:var(--coin-uni);color:#0b0d10"><b>UNI</b><i>--coin-uni</i></div><div class="sw" style="background:var(--coin-sui);color:#0b0d10"><b>SUI</b><i>--coin-sui</i></div></div></body></html>
