<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminalfor — MOEX Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      *{box-sizing:border-box}
      html,body{margin:0;min-height:100%}
      body{background:var(--bg-app);color:var(--text-primary);font:var(--type-body);-webkit-font-smoothing:antialiased}
      #root{min-height:100vh}
      *{scrollbar-width:thin;scrollbar-color:var(--surface-raised) transparent}
      *::-webkit-scrollbar{width:8px;height:8px}
      *::-webkit-scrollbar-track{background:transparent}
      *::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:var(--r-pill)}
      *::-webkit-scrollbar-thumb:hover{background:var(--n-600)}
      *::-webkit-scrollbar-corner{background:transparent}
      /* Price-tick flash: starts at full intensity (the keyframe, not a
         transition, so it never fades in) and eases out over the run. */
      @keyframes tf2PriceFlashUp{from{background-color:color-mix(in srgb, var(--positive) 55%, transparent)}to{background-color:transparent}}
      @keyframes tf2PriceFlashDown{from{background-color:color-mix(in srgb, var(--negative) 55%, transparent)}to{background-color:transparent}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
