services:
  api:
    build: ./server
    container_name: terminalfor2-api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      PORT: "4000"

  web:
    build: .
    container_name: terminalfor2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
